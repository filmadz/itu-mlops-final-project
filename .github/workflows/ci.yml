name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests with Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.19.11"
          verb: call
          args: test